i Musa a.s.", "Nabi Daud a.s.", "Nabi Isa a.s.", "Nabi Muhammad SAW"]}, {"type": "mc", "q": "Berapakah kitab yang wajib diketahui?", "opts": ["4", "5", "6", "10"], "answer": 0}, {"type": "mc", "q": "Kitab Taurat diturunkan kepada…", "opts": ["Nabi Musa a.s.", "Nabi Isa a.s.", "Nabi Daud a.s.", "Nabi Adam a.s."], "answer": 0}, {"type": "mc", "q": "Kitab Zabur diturunkan kepada…", "opts": ["Nabi Daud a.s.", "Nabi Musa a.s.", "Nabi Isa a.s.", "Nabi Nuh a.s."], "answer": 0}, {"type": "mc", "q": "Kitab Injil diturunkan kepada…", "opts": ["Nabi Isa a.s.", "Nabi Musa a.s.", "Nabi Daud a.s.", "Nabi Ibrahim a.s."], "answer": 0}]}, {"title": "Beriman kepada Rasul", "notes": ["Rasul ialah utusan Allah yang menyampaikan wahyu kepada umat manusia.", "Ada <b>25 rasul<\/b> yang wajib diketahui.", "Rasul pertama: <b>Nabi Adam a.s.<\/b>", "Rasul terakhir: <b>Nabi Muhammad SAW<\/b>.", {"numberedGrid": ["Adam", "Idris", "Nuh", "Hud", "Saleh", "Ibrahim", "Lut", "Ismail", "Ishak", "Yaakub", "Yusuf", "Ayub", "Syu’aib", "Musa", "Harun", "Zulkifli", "Daud", "Sulaiman", "Ilyas", "Ilyasa’", "Yunus", "Zakaria", "Yahya", "Isa", "Muhammad"]}], "questions": [{"type": "mc", "q": "Berapa rasul yang wajib diketahui?", "opts": ["25", "10", "4", "6"], "answer": 0}, {"type": "mc", "q": "Rasul yang pertama ialah…", "opts": ["Nabi Adam a.s.", "Nabi Nuh a.s.", "Nabi Musa a.s.", "Nabi Isa a.s."], "answer": 0}, {"type": "mc", "q": "Rasul yang terakhir ialah…", "opts": ["Nabi Muhammad SAW", "Nabi Isa a.s.", "Nabi Ibrahim a.s.", "Nabi Daud a.s."], "answer": 0}, {"type": "mc", "q": "Yang manakah nama rasul?", "opts": ["Nabi Ismail a.s.", "Malik", "Raqib", "Ridwan"], "answer": 0}, {"type": "mc", "q": "Yang manakah nama rasul?", "opts": ["Nabi Ilyas a.s.", "Mikail", "Israfil", "Atid"], "answer": 0}]}, {"title": "Beriman kepada Hari Kiamat", "notes": ["Hari kiamat ialah hari berakhirnya kehidupan dunia.", "<b>Tanda kiamat kecil<\/b> (contoh): banyak berlaku maksiat, amanah diabaikan dan ilmu agama semakin berkur const KEY='misi_tauhid_sapkjb_v2';let state={name:'',kelas:'',topic:0,phase:'start',q:0,scores:[],answered:false};

const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...state,answered:false}))}catch(e){}};
function button(label,fn,klass=''){let b=document.createElement('button');b.className='btn '+klass;b.textContent=label;b.onclick=fn;return b}
function el(tag,cls,html){let e=document.createElement(tag);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e}
function panel(html){app.replaceChildren(el('section','panel',html));return app.firstChild}
function scrollTopGame(){window.scrollTo({top:0,behavior:'instant'})}
function render(){if(state.phase==='start')return start();if(state.phase==='note')return note();if(state.phase==='quiz')return quiz();if(state.phase==='topicDone')return topicDone();return final()}
function start(){let p=panel('<div class="emoji">📚🎮</div><h2 style="text-align:center">Selamat Datang!</h2><p class="sub" style="text-align:center">Lengkapkan 9 tajuk dan 45 soalan. Baca nota sebelum bermain. Screenshot keputusan selepas tamat semua kuiz.</p><label for="nm">Nama murid</label><input id="nm" maxlength="60" autocomplete="name" placeholder="Contoh: Sakinah"><label for="kl">Kelas</label><input id="kl" maxlength="30" placeholder="Contoh: 5 Ilyas"><p class="small muted">Kemajuan disimpan pada browser peranti ini. Jangan padam data browser sebelum tamat.</p>');p.querySelector('#nm').value=state.name;p.querySelector('#kl').value=state.kelas;let actions=el('div','actions');actions.append(button(state.scores.length?'Sambung Misi':'Mula Misi',()=>{let n=p.querySelector('#nm').value.trim(),k=p.querySelector('#kl').value.trim();if(!n||!k){alert('Sila isi nama dan kelas dahulu.');return}if(state.scores.length&&(n!==state.name||k!==state.kelas)){if(!confirm('Nama atau kelas berubah. Mulakan semula markah untuk murid baharu?'))return;state.scores=[];state.topic=0;state.q=0}state.name=n;state.kelas=k;state.phase=state.scores.length===9?'final':'note';save();render();scrollTopGame()}));if(state.name)actions.append(button('Padam kemajuan',()=>{if(confirm('Padam semua markah dan mula semula?')){localStorage.removeItem(KEY);state={name:'',kelas:'',topic:0,phase:'start',q:0,scores:[],answered:false};render()}},'ghost'));p.append(actions)}
function noteHtml(n){if(typeof n==='string')return '<div class="note">'+n+'</div>';if(n.list)return '<div class="note"><ol>'+n.list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div>';if(n.arabic)return '<div class="note arabic" lang="ar" dir="rtl">'+esc(n.arabic)+'</div>';if(n.pairs)return '<div class="note">'+n.pairs.map(x=>'<div class="pairrow"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>').join('')+'</div>';if(n.numberedGrid)return '<div class="note two">'+n.numberedGrid.map((x,i)=>'<div class="item">'+(i+1)+'. '+esc(x)+'</div>').join('')+'</div>';return ''}
function note(){let t=TOPICS[state.topic];if(!t){state.phase='final';return render()}let p=panel('<span class="chip">TAJUK '+(state.topic+1)+' / 9</span><h2>'+esc(t.title)+'</h2><p class="sub">Baca dan fahami nota sebelum menjawab kuiz.</p><div class="progress"><span style="width:'+(state.scores.length/9*100)+'%"></span></div>'+t.notes.map(noteHtml).join(''));let a=el('div','actions');a.append(button('Saya sudah baca • Mula Kuiz ➜',()=>{state.phase='quiz';state.q=0;state.answered=false;save();render();scrollTopGame()}));p.append(a)}
function quiz(){let t=TOPICS[state.topic],q=t.questions[state.q];if(!q){state.phase='topicDone';return render()}let p=panel('<span class="chip">'+esc(t.title)+'</span><p class="count">Soalan '+(state.q+1)+' / 5</p><div class="progress"><span style="width:'+(state.q/5*100)+'%"></span></div><h2 class="qtitle">'+esc(q.q)+'</h2><div id="activity"></div><div id="feedback" role="status"></div><div id="next"></div>');let a=p.querySelector('#activity');if(q.type==='mc')renderMC(q,a);else if(q.type==='order')renderOrder(q,a);else renderPair(q,a)}
function finishQuestion(ok,correct){if(state.answered)return;state.answered=true;if(ok)state.scores[state.topic]=(state.scores[state.topic]||0)+1;let f=app.querySelector('#feedback');f.className='feedback '+(ok?'good':'bad');f.innerHTML=(ok?'✅ Betul! Tahniah!':'❌ Maaf, jawapan kurang tepat.')+(correct?'<div class="small" style="margin-top:7px">Jawapan betul: '+correct+'</div>':'');let next=app.querySelector('#next');next.className='actions';next.append(button(state.q===4?'Lihat Markah Tajuk ➜':'Soalan Seterusnya ➜',()=>{state.q++;state.answered=false;if(state.q>=5)state.phase='topicDone';save();render();scrollTopGame()}));save()}
function renderMC(q,a){let idx=q.opts.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}let wrap=el('div','stack');idx.forEach(i=>{let b=el('button','choice',esc(q.opts[i]));b.onclick=()=>{if(state.answered)return;wrap.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add(i===q.answer?'correct':'wrong');if(i!==q.answer)Array.from(wrap.children).find(x=>x.textContent===q.opts[q.answer])?.classList.add('correct');finishQuestion(i===q.answer,esc(q.opts[q.answer]))};wrap.append(b)});a.append(wrap)}
function renderOrder(q,a){let items=q.items.map((v,i)=>({v,i}));for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}let chosen=[];let seq=el('div','sequence');let pool=el('div','');let info=el('p','small muted','Tekan perkataan mengikut urutan yang betul. Tekan “Padam pilihan” untuk cuba susun semula sebelum semak.');a.append(info,seq,pool);let arab=/[\u0600-\u06FF]/.test(q.items[0]);function draw(){seq.innerHTML=chosen.length?'':'<span class="muted">Pilihan anda akan muncul di sini…</span>';if(arab){seq.dir='rtl'}else seq.dir='ltr';chosen.forEach(x=>{let s=el('span','tile selected'+(arab?' arabic':''),esc(x.v));seq.append(s)});pool.replaceChildren();items.filter(x=>!chosen.includes(x)).forEach(x=>{let b=el('button','tile'+(arab?' arabic':''),esc(x.v));b.onclick=()=>{chosen.push(x);draw()};pool.append(b)});check.disabled=chosen.length!==items.length}let controls=el('div','actions');let clear=button('Padam pilihan',()=>{chosen=[];draw()},'secondary');let check=button('Semak Jawapan',()=>{let ok=chosen.every((x,i)=>x.i===i);pool.querySelectorAll('button').forEach(b=>b.disabled=true);clear.disabled=true;check.disabled=true;finishQuestion(ok,arab?'<span class="arabic" dir="rtl">'+q.items.map(esc).join(' ')+'</span>':q.items.map((x,i)=>(i+1)+'. '+esc(x)).join('<br>'))});controls.append(clear,check);a.append(controls);draw()}
function renderPair(q,a){
 const right=q.right.map((v,i)=>({v,i}));
 for(let i=right.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[right[i],right[j]]=[right[j],right[i]]}
 const selected=Array(q.left.length).fill(null), source=el('div','stack'), targets=el('div','stack');
 const info=el('p','small muted','Seret nama ke kotak jawapan yang betul. Pada telefon, sentuh nama kemudian sentuh kotak jawapan.');
 const grid=el('div','paircols');a.append(info,grid);grid.append(source,targets);
 let active=null;
 function put(i,j){if(state.answered)return;selected[j]=i;active=null;draw()}
 function draw(){source.replaceChildren();targets.replaceChildren();
  q.left.forEach((v,i)=>{let used=selected.includes(i),btn=el('button','choice'+(active===i?' selected':''),esc(v));btn.type='button';btn.draggable=!used;btn.disabled=used;btn.setAttribute('aria-label','Seret '+v);btn.addEventListener('dragstart',e=>{active=i;e.dataTransfer.setData('text/plain',String(i));e.dataTransfer.effectAllowed='move'});btn.onclick=()=>{active=i;draw()};source.append(btn)});
  right.forEach((r,j)=>{let box=el('button','choice drop-target'+(selected[j]!==null?' filled':''),'<span class="small">'+esc(r.v)+'</span><br><strong>'+(selected[j]===null?'⬇ Letak di sini':esc(q.left[selected[j]]))+'</strong>');box.type='button';box.onclick=()=>{if(active!==null)put(active,j);else if(selected[j]!==null){selected[j]=null;draw()}};box.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move'});box.addEventListener('drop',e=>{e.preventDefault();let i=Number(e.dataTransfer.getData('text/plain'));if(Number.isInteger(i)&&i>=0&&i<q.left.length)put(i,j)});targets.append(box)});
  check.disabled=selected.some(x=>x===null);
 }
 const controls=el('div','actions');const clear=button('Padam Padanan',()=>{selected.fill(null);active=null;draw()},'secondary');const check=button('Semak Jawapan',()=>{if(selected.some(x=>x===null))return;clear.disabled=true;check.disabled=true;source.querySelectorAll('button').forEach(x=>x.disabled=true);targets.querySelectorAll('button').forEach(x=>x.disabled=true);let ok=right.every((r,j)=>selected[j]===r.i);finishQuestion(ok,q.left.map((s,i)=>esc(s)+' — '+esc(q.right[i])).join('<br>'))});controls.append(clear,check);a.append(controls);draw();
}
function topicDone(){let s=state.scores[state.topic]||0,t=TOPICS[state.topic];let p=panel('<div class="emoji">'+(s>=4?'🏆':'🌟')+'</div><h2 style="text-align:center">Tajuk Selesai!</h2><p style="text-align:center">'+esc(t.title)+'</p><div class="result">'+s+' / 5</div><p style="text-align:center">'+(s>=4?'Hebat! Teruskan usaha!':'Syabas kerana mencuba! Teruskan belajar!')+'</p>');let a=el('div','actions');a.append(button(state.topic===8?'Lihat Keputusan Akhir 🎉':'Teruskan Tajuk Seterusnya ➜',()=>{state.topic++;state.q=0;state.phase=state.topic===9?'final':'note';save();render();scrollTopGame()}));p.append(a)}
function final(){let sum=state.scores.reduce((a,b)=>a+b,0),pct=Math.round(sum/45*100);let now=new Date();let date=now.toLocaleDateString('ms-MY',{day:'2-digit',month:'long',year:'numeric'});let p=panel('<div class="emoji">🏆🎉</div><h2 style="text-align:center">TAHNIAH! MISI SELESAI</h2><p style="text-align:center"><b>'+esc(state.name)+'</b><br>'+esc(state.kelas)+'</p><p class="sub" style="text-align:center">Keputusan Akhir Misi Tauhid Darjah 5</p><div class="result">'+sum+' / 45</div><p style="text-align:center;font-size:20px"><b>'+pct+'%</b> • '+(pct>=80?'CEMERLANG':pct>=60?'BAIK':pct>=40?'TERUSKAN USAHA':'JANGAN PUTUS ASA')+'</p><h3>Markah Mengikut Tajuk</h3>'+TOPICS.map((t,i)=>'<div class="resultrow"><span>'+(i+1)+'. '+esc(t.title)+'</span><b>'+(state.scores[i]||0)+'/5</b></div>').join('')+'<p style="text-align:center" class="small">Tarikh: '+esc(date)+'</p><div class="note" style="text-align:center"><b>📸 SILA SCREENSHOT KEPUTUSAN INI</b><br>Hantar gambar keputusan kepada guru anda sebagai rekod PdPR.</div>');let a=el('div','actions no-print');a.append(button('📸 Panduan Screenshot',()=>alert('Telefon: gunakan butang screenshot peranti anda. Komputer: tekan Windows + Shift + S. Pastikan nama, kelas dan jumlah markah kelihatan.')));a.append(button('Cetak / Simpan PDF',()=>window.print(),'secondary'));a.append(button('Murid Baharu',()=>{if(confirm('Mulakan semula untuk murid baharu? Markah lama akan dipadam daripada peranti ini.')){localStorage.removeItem(KEY);state={name:'',kelas:'',topic:0,phase:'start',q:0,scores:[],answered:false};render();scrollTopGame()}},'ghost'));p.append(a)}
render();
</script></body></html>
